name: static-web-deploy
'on':
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment containing the SWA token
        type: string
        required: true
      artifact-name:
        description: Artifact produced by static-web-build in the same run
        type: string
        default: static-web
      action:
        description: upload or close
        type: string
        default: upload
      deployment-environment:
        description: Optional named Azure SWA preview environment
        type: string
        default: ''
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        required: false
    outputs:
      url:
        description: url
        value: ${{ jobs.deploy.outputs.url }}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ format('swa-{0}-{1}-{2}', inputs.environment, inputs.deployment-environment, github.event.pull_request.number
        || 'release') }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
    - name: Validate action
      shell: bash
      run: |
        [[ "$ACTION" == upload || "$ACTION" == close ]] || { echo '::error::action must be upload or close'; exit 1; }
        [[ -n "$TOKEN" ]] || { echo '::error::Missing AZURE_STATIC_WEB_APPS_API_TOKEN'; exit 1; }
      env:
        ACTION: ${{ inputs.action }}
        TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    - name: Download static artifact
      if: ${{ inputs.action == 'upload' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: static-web-artifact
    - id: deploy
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ github.event_name == 'pull_request' && secrets.GITHUB_TOKEN || '' }}
        action: ${{ inputs.action }}
        app_location: ${{ inputs.action == 'upload' && 'static-web-artifact' || '' }}
        api_location: ''
        output_location: ''
        skip_app_build: true
        skip_api_build: true
        deployment_environment: ${{ inputs.deployment-environment }}
